openapi: 3.0.0
info:
  title: My Book Ordering API
  description: An API for managing book orders
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
paths:
  /items:
    get:
      summary: Get all books
      responses:
        '200':
          description: A list of books
  /items/item/{id}:
    get:
      summary: Get a book by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the book to retrieve
          schema:
            type: string
      responses:
        '200':
          description: The requested book
  /users/login:
    post:
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in successfully
  /users/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                address:
                  type: string
      responses:
        '200':
          description: Registered successfully
