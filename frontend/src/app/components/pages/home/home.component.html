<div *ngIf="!paramsFlag">
    <div class="page">
        <app-imgslider [images]="images"></app-imgslider>
        <h1>All Our Bookies</h1>
    </div>

    <div>
        <!-- SALES -->
        <app-sales></app-sales>

        <!-- CS -->
        <app-cs></app-cs>

        <!-- ELECTRONIC ENGINEERING -->
        <app-ilektroniki></app-ilektroniki>

        <!-- MECHANICAL ENGINEERING -->
        <app-mixanologia></app-mixanologia>

        <!-- TELECOMMUNICATIONS ENGINEERING -->
        <app-tilepikinonies></app-tilepikinonies>
    </div>
</div>

<div *ngIf="paramsFlag">
    <div class="search-result">
        <div class="products">
            <!-- SEARCH RESULTS -->
            <h2>SEARCH RESULTS</h2>
            <ul>
                <li *ngFor="let food of foods;">
                    <div>
                        <a routerLink="/item/{{food.id}}">
                            <img [src]="food.imageUrl" [alt]="food.name">
                            <div class="content">
                                <div class="name">
                                    {{food.name}}
                                </div>
                                <div class="ingredients">
                                    {{food.ingredients}}
                                </div>
                                <div class="price">
                                    <span>
                                        {{food.price | currency : '€'}}
                                    </span>
                                </div>
                            </div>
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>

<div *ngIf="paramsFlag && !foods.length" class="empty">
    <p>
        No Items Found
    </p>
</div>
