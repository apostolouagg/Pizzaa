<div class="page">
    <div class="products">
        <!-- SALES -->
        <h2>SALES</h2>
        <ul>
            <li *ngFor="let food of foods;">
                <div *ngIf="food.tag.includes('sales')">
                    <a routerLink="/item/{{food.id}}">
                        <img [src]="food.imageUrl" [alt]="food.name">
                        <div class="content">
                            <div class="name">
                                {{food.name}}
                            </div>
                            <div class="price">
                                <div>
                                    <span class="sale">
                                        {{food.price+20 | currency : '€'}}
                                    </span>
                                    <span style="color: red;">
                                        {{food.price | currency : '€'}}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </li>
        </ul>
    </div>
</div>
